<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Tjuvmyndigheten – för en effektivare egendomsöverföring">
  <rect width="1200" height="630" fill="#ffffff"/>
  <svg x="60" y="200" width="260" height="234" viewBox="0 0 100 90">
  <defs>
    <!-- en kofot, liggande från nere till vänster upp till höger -->
    <g id="bar" fill="none" stroke-linejoin="round">
      <path d="M8,86 L15,80 L80,15 C86,8 93,8 95,15 L95,25" stroke="#2e4644" stroke-width="7"/>
      <path d="M20,75 L78,17" stroke="#fff" stroke-width="1"/>
      <path d="M95,19 L95,26" stroke="#fff" stroke-width="1.2"/>
      <path d="M5,87 L13,86" stroke="#fff" stroke-width="1.2"/>
    </g>
  </defs>
  <!-- gula vinklar -->
  <g fill="none" stroke="#c9a23a" stroke-width="7" stroke-linejoin="miter">
    <path d="M40,24 L50,14 L60,24"/>
    <path d="M40,66 L50,76 L60,66"/>
  </g>
  <use href="#bar"/>
  <!-- vit kant där kofötterna korsar varandra -->
  <clipPath id="mid"><rect x="38" y="35" width="24" height="24"/></clipPath>
  <path d="M85,80 L20,15" stroke="#fff" stroke-width="11" fill="none" clip-path="url(#mid)"/>
  <use href="#bar" transform="translate(100,0) scale(-1,1)"/>
</svg>
  <text x="350" y="330" fill="#2e4644" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="94" letter-spacing="-1">Tjuvmyndigheten</text>
  <text x="354" y="390" fill="#2e4644" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" letter-spacing="5.4">FÖR EN EFFEKTIVARE EGENDOMSÖVERFÖRING</text>
</svg>
